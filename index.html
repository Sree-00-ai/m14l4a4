
<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Arrow Functions</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2ff;
            text-align: center;
            padding: 30px;
        }

        .container {
            background-color: white;
            padding: 25px;
            max-width: 450px;
            margin: auto;
            border-radius: 12px;
        }

        input, button {
            padding: 10px;
            margin: 8px;
            font-size: 16px;
        }

        button {
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #result {
            color: green;
            font-weight: bold;
            white-space: pre-line;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Arrow Function Calculator</h2>

        <input type="number" id="num1" placeholder="First number">
        <br>

        <input type="number" id="num2" placeholder="Second number">
        <br>

        <button onclick="calculate()">Add Numbers</button>

        <p id="result">Result will appear here.</p>
    </div>

    <script>
        // Arrow function
        const add = (a, b) => {
            return a + b;
        };

        function calculate() {
            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);

            let answer = add(num1, num2);

            document.getElementById("result").textContent =
                "Sum: " + answer;
        }
    </script>

</body>
</html>
